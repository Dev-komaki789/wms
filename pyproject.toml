[project]
name = "wms"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# 自動生成される migrations はフォーマット・lint 対象外にする
# （Django が再生成すると差分が出てしまうため）
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.format]
# 既存コードはシングルクォート統一のため format でも維持する
quote-style = "single"
