# WMS 用 nginx サイト設定（HTTP/ポート80）。
# 配置先: /etc/nginx/sites-available/wms → sites-enabled へシンボリックリンク
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wms
#   sudo ln -s /etc/nginx/sites-available/wms /etc/nginx/sites-enabled/wms
#   sudo rm -f /etc/nginx/sites-enabled/default   # 既定サイトを無効化
#   sudo nginx -t && sudo systemctl reload nginx
#
# この後 `sudo certbot --nginx -d example.com -d www.example.com` を実行すると、
# certbot が自動で 443(HTTPS) ブロックと http→https リダイレクトを追記する。
# server_name は自分のドメインに置き換えること。

server {
    listen 80;
    server_name example.com www.example.com;

    # アップロード上限（CSV取込などに余裕を持たせる）
    client_max_body_size 10M;

    # 静的ファイルは nginx から直接返す（collectstatic の集約先 STATIC_ROOT を指す）
    location /static/ {
        alias /home/ubuntu/wms/staticfiles/;
        expires 30d;
        access_log off;
    }

    # それ以外は gunicorn(127.0.0.1:8000) へ転送
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ↓ Django の SECURE_PROXY_SSL_HEADER が「元は HTTPS」を判定するために必須
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
